# Whole engine, MASTER build (BBC Master 128, textured port step 1 --
# docs/master_textured_spec.md).  A BANKED build: banks A (4) and B (7)
# hold exactly what they hold on the Model B, and MAIN is the Model B
# MAIN region unchanged.  The difference is bank C: its content is laid
# LINEAR in main RAM at CBITS_M ($5800) -- free on the Master because both
# screens live in shadow RAM -- with the same offsets as the bank-C window
# (CBANK_ORG = CBITS_M in abi.inc):
#   $5800-$6FFF  clipper code (BANKC; was $8000-$97FF)
#   $7000-$78FF  bank-C data, Python-seeded: VEXPL_CONT, FW state, SINCOS,
#                OBJ_ART, VDESC, VEXPL_LO/HI (was $9800-$A0FF)
#   $7900-$79FF  object dispatch tables (VPTAB; banked: the VPLOTC tail)
# No rasteriser, plotters, clears or bank-C HUD: plot_h, plot_v,
# RASTER_ENTRY and fb_clr* are RTS emit stubs in BANKC (step 3 replaces
# them with column emission).  Bank 6 is left for textures.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    WORK:   start = $0E20, size = $00E0, type = rw, file = "";
    MAIN:   start = $0F00, size = $4900, file = "engine_m.bin";
    CBITS:  start = $5800, size = $1800, file = "engine_cbits_m.bin";
    VPTABM: start = $7900, size = $0100, file = "engine_vptab_m.bin";
    # HAZEL (ACCCON Y, held on for the whole render): the filler and wall
    # texturer (master/mfill.s) above the boot block's pattern + HUD at
    # $C000; their BSS in the top 512 bytes.
    HZM:    start = $C800, size = $1600, file = "engine_hazel_m.bin";
    HZB:    start = $DE00, size = $0200, type = rw, file = "";
    # Step 4 wall tables (master_walls.py fills them; the image builders
    # find them by label): ANDY, 4K of private RAM over $8000-$8FFF while
    # ROMSEL bit 7 is set (no OS runs after the loader, so all of it is
    # ours); the tail of bank 6 above the texels (bank 6 = BANK_C, paged
    # for the whole emit cascade); main RAM above VPTAB.
    ANDYM:  start = $8000, size = $1000, type = rw, file = "";
    B6TM:   start = $B900, size = $0700, type = rw, file = "";
    IXM:    start = $7A00, size = $0600, type = rw, file = "";
    # Step 5 plane caches and the span snapshot: HAZEL $C280-$C7FF, above
    # the boot block's pattern + HUD (mhazel.bin, asserted < $280 by
    # build_master_ssd).
    HZP:    start = $C280, size = $0580, type = rw, file = "";
}
SEGMENTS {
    DRV:    load = MAIN, type = ro;   # first in MAIN: entry stays $0F00
    ZEROPAGE: load = ZP, type = zp;
    WORK:   load = WORK,  type = bss;
    BANKC:  load = CBITS, type = ro;
    BANKCHOST: load = CBITS, type = ro, optional = yes;  # empty: no rasteriser
    RASTER: load = CBITS, type = ro, optional = yes;     # empty
    VPLOTC: load = CBITS, type = ro, optional = yes;     # empty
    VPTAB:  load = VPTABM, type = ro;
    PMOVE:  load = MAIN,  type = ro, start = $1340;
    PMH:    load = MAIN,  type = ro;
    CODE:   load = MAIN,  type = ro, align = $100;
    RWC:    load = MAIN,  type = ro, optional = yes;
    RWCARD: load = MAIN,  type = ro, optional = yes;
    SHTAB:  load = MAIN,  type = ro, start = $5600, optional = yes;
    PMB1:   load = MAIN,  type = ro;
    PMB2:   load = MAIN,  type = ro;
    PMB3:   load = MAIN,  type = ro;
    PMB4:   load = MAIN,  type = ro;
    PMEXT:  load = MAIN,  type = ro;
    PMSF:   load = MAIN,  type = ro, optional = yes;
    OBJX:   load = MAIN,  type = ro, optional = yes;
    OBJB:   load = MAIN,  type = ro, optional = yes;
    OBJG:   load = MAIN,  type = ro, optional = yes;
    PQ:     load = MAIN,  type = ro, optional = yes;
    PMMU:   load = MAIN,  type = ro, optional = yes;
    PMWK:   load = MAIN,  type = ro, optional = yes;
    PMCND:  load = MAIN,  type = ro, optional = yes;
    PMZ:    load = MAIN,  type = ro, optional = yes;
    PMCOL:  load = MAIN,  type = ro, optional = yes;
    HUD:    load = MAIN,  type = ro, optional = yes;     # empty: HUD is HAZEL's
    MFILL:  load = HZM,   type = ro;
    MFILLBSS: load = HZB, type = bss;
    MANDY:  load = ANDYM, type = bss;
    MB6T:   load = B6TM,  type = bss;
    MTEXIX: load = IXM,   type = bss;
    MPSEG:  load = IXM,   type = bss;
    MPLANE: load = HZP,   type = bss;
}
