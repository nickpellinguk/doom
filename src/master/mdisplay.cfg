# Master display bring-up: MAIN at &1900, the HAZEL block is shipped
# inside the file and copied to &C000 (page-aligned: FLIP sits first).
MEMORY {
    ZP:    start = $0070, size = $10;
    RAM:   start = $1900, size = $1700, file = %O;
    HZ:    start = $C000, size = $2000;
}
SEGMENTS {
    MAIN:  load = RAM, type = ro;
    HAZEL: load = RAM, run = HZ, type = ro, define = yes, align = $100;
}
