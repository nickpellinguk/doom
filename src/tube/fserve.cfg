# The fill server (docs/tube_master.md H3): master/mfill.s (SERVER) and
# tube/fserve.s on the second processor's flat 64K. The span pool keeps
# its engine home, POOL = $1800-$19FF (abi.inc), and the quarter squares
# sit where the Model B kept them ($0200). Everything below $F800.
MEMORY {
    ZP:    start = $0000, size = $0100, type = rw, file = "";
    SQR:   start = $0200, size = $0600, type = rw, file = "";
    LOW:   start = $0800, size = $0600, type = rw, file = "";
    WORK:  start = $0E20, size = $00E0, type = rw, file = "";
    MID:   start = $0F00, size = $0900, type = rw, file = %O, fill = yes;
    ANDY:  start = $2000, size = $1000, type = rw, file = "";
    B6R:   start = $3000, size = $1000, type = rw, file = "";
    CODE:  start = $4000, size = $4000, type = rw, file = %O, fill = yes;
    IV:    start = $8000, size = $4200, type = rw, file = "";
    DL:    start = $C200, size = $1C00, type = rw, file = "";
    REQ:   start = $DE00, size = $0C00, type = rw, file = "";
    FSB:   start = $EA00, size = $0E00, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    MSQR:     load = SQR,  type = bss;
    MPLANE:   load = LOW,  type = bss;
    MFILLBSS: load = LOW,  type = bss;
    WORK:     load = WORK, type = bss;
    MFMAIN:   load = MID,  type = rw;
    MFILLV:   load = MID,  type = rw;
    MARITH:   load = MID,  type = rw;
    MTEXIX:   load = MID,  type = bss;
    MANDY:    load = ANDY, type = bss;
    MB6R:     load = B6R,  type = bss;
    MFILL:    load = CODE, type = rw, align = $100;
    MB6C:     load = CODE, type = rw;
    MFILLC:   load = CODE, type = rw;
    FSCODE:   load = CODE, type = rw;
    CODE:     load = CODE, type = rw, optional = yes;
    PMOVE:    load = CODE, type = rw, optional = yes;
    PMH:      load = CODE, type = rw, optional = yes;
    BANKC:    load = CODE, type = rw, optional = yes;
    MB6T:     load = CODE, type = bss;
    FSIV:     load = IV,   type = bss, align = $100;
    FSDL:     load = DL,   type = bss;
    FSREQ:    load = REQ,  type = bss;
    FSBSS:    load = FSB,  type = bss;
}
