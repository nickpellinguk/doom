# The fill server (docs/tube_master.md H3, H4): master/mfill.s (SERVER)
# and tube/fserve.s on the second processor's 64K. The file is the image
# $0C00-$71FF (code and initialised tables), loaded under the running
# Tube client and BASIC, so it keeps off pages 0-7 and $8000 up until
# fs_main takes the machine over (and clears the BSS). The span pool
# keeps its engine home, POOL = SPAN_POOL = $0A00-$0BFF (abi.inc).
# Nothing at $F800 up but the IRQ vector ($FFFE).
MEMORY {
    ZP:    start = $0000, size = $0100, type = rw, file = "";
    LOW:   start = $0200, size = $0600, type = rw, file = "";
    IMG:   start = $0C00, size = $1400, type = rw, file = %O, fill = yes;
    ANDY:  start = $2000, size = $1000, type = rw, file = %O, fill = yes;
    B6R:   start = $3000, size = $1000, type = rw, file = %O, fill = yes;
    CODE:  start = $4000, size = $3200, type = rw, file = %O, fill = yes;
    IV:    start = $7200, size = $3100, type = rw, file = "";
    LA:    start = $A300, size = $1D00, type = rw, file = "";
    RING:  start = $C000, size = $1000, type = rw, file = "";
    LB:    start = $D000, size = $1D00, type = rw, file = "";
    FSB:   start = $ED00, size = $0900, type = rw, file = "";
    HI:    start = $F600, size = $0200, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    MPLANE:   load = LOW,  type = bss;
    MFILLBSS: load = LOW,  type = bss;
    MSQR:     load = IMG,  type = rw, align = $100;
    MFMAIN:   load = IMG,  type = rw;
    MFILLV:   load = IMG,  type = rw;
    MARITH:   load = IMG,  type = rw;
    MTEXIX:   load = IMG,  type = rw;
    MANDY:    load = ANDY, type = rw;
    MB6R:     load = B6R,  type = rw;
    MFILL:    load = CODE, type = rw, align = $100;
    MB6C:     load = CODE, type = rw;
    MFILLC:   load = CODE, type = rw;
    FSCODE:   load = CODE, type = rw;
    CODE:     load = CODE, type = rw, optional = yes;
    PMOVE:    load = CODE, type = rw, optional = yes;
    PMH:      load = CODE, type = rw, optional = yes;
    BANKC:    load = CODE, type = rw, optional = yes;
    MB6T:     load = CODE, type = rw;
    FSIV:     load = IV,   type = bss, align = $100;
    FSLA:     load = LA,   type = bss;
    FSBSS:    load = FSB,  type = bss;
    FSRING:   load = RING, type = bss;
    FSLB:     load = LB,   type = bss;
    WORK:     load = HI,   type = bss;
}
